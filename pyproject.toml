[project]
name = "investment-x-buddy"
version = "0.1.0"
description = "投资 X Buddy · 自研 Agent Harness（研究执行器）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
  # ToolSpec.schema_json 是契约字段名（HANDOFF §6.1，不可改名），
  # 与 Pydantic v2 中已废弃的 BaseModel.schema_json() 同名 → 属已知且无害的遮蔽告警。
  'ignore:Field name "schema_json".*shadows an attribute in parent:UserWarning',
]
